name: Build & release Localview Installer

on:
  push:
    branches: [main]
    # Docs/CI-only changes don't produce a release; every app change must bump `version:` in pubspec.yaml.
    paths-ignore: ['**.md', '.github/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        shell: bash
        run: |
          echo "LI_VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.50.0, channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: test
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        shell: bash
        run: |
          echo "LI_VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with: { flutter-version: 3.50.0, channel: stable, cache: true }
      - name: Flutter for Windows ARM64 (built from the 3.50.0 tag; no prebuilt arm64 SDK is published)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git C:\flutter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\flutter\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          C:\flutter\bin\flutter.bat --version
      - run: flutter build windows --release --dart-define=LI_VERSION=${{ env.LI_VERSION }}
      - shell: pwsh
        run: |
          $d = "LocalviewInstaller-windows-${{ matrix.arch }}"
          Copy-Item -Recurse "build\windows\${{ matrix.arch }}\runner\Release" $d
          Rename-Item "$d\localview_installer.exe" "Localview Installer.exe"
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - uses: actions/upload-artifact@v4
        with: { name: "windows-${{ matrix.arch }}", path: "LocalviewInstaller-windows-*.zip" }

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        shell: bash
        run: |
          echo "LI_VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.50.0, channel: stable, cache: true }
      - run: flutter build macos --release --dart-define=LI_VERSION=${{ env.LI_VERSION }}
      - run: |
          APP="build/macos/Build/Products/Release/Localview Installer.app"
          codesign --force --deep -s - "$APP"
          mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Localview Installer" -srcfolder dmg -ov -format UDZO LocalviewInstaller-macos.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: LocalviewInstaller-macos.dmg }

  linux:
    needs: test
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        shell: bash
        run: |
          echo "LI_VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev file
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-analytics && flutter build linux --release --dart-define=LI_VERSION=${{ env.LI_VERSION }}
      - name: Package (AppImage + tar.gz)
        run: |
          B=$(ls -d build/linux/*/release/bundle)
          D=LocalviewInstaller-linux-${{ matrix.arch }}
          cp -r "$B" "$D" && tar czf "$D.tar.gz" "$D"
          A=$(mktemp -d)/LocalviewInstaller.AppDir
          mkdir -p "$A/usr/lib/app" && cp -r "$B"/. "$A/usr/lib/app/" && cp assets/icon.png "$A/localview-installer.png"
          printf '#!/bin/sh\nHERE=$(dirname "$(readlink -f "$0")")\nexec "$HERE/usr/lib/app/localview_installer" "$@"\n' > "$A/AppRun" && chmod +x "$A/AppRun"
          printf '[Desktop Entry]\nType=Application\nName=Localview Installer\nExec=localview-installer\nIcon=localview-installer\nCategories=Utility;\n' > "$A/localview-installer.desktop"
          ARCH=$([ "${{ matrix.arch }}" = arm64 ] && echo aarch64 || echo x86_64)
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$ARCH.AppImage" && chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=$ARCH ./appimagetool --no-appstream "$A" "$D.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            LocalviewInstaller-linux-*.tar.gz
            LocalviewInstaller-linux-*.AppImage

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        shell: bash
        run: |
          echo "LI_VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.50.0, channel: stable, cache: true }
      - name: Signing key (keeps Android self-updates installable)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: the APK is signed with a temporary key."
          fi
      - run: flutter build apk --release --dart-define=LI_VERSION=${{ env.LI_VERSION }}
        env:
          LV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk LocalviewInstaller-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: LocalviewInstaller-android.apk }

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        shell: bash
        run: |
          echo "LI_VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.50.0, channel: stable, cache: true }
      - run: flutter build ios --release --no-codesign --dart-define=LI_VERSION=${{ env.LI_VERSION }}
      - run: mkdir Payload && cp -R build/ios/iphoneos/Runner.app Payload/ && zip -qr LocalviewInstaller-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: LocalviewInstaller-ios-unsigned.ipa }

  release:
    needs: [windows, macos, linux, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        shell: bash
        run: |
          echo "LI_VERSION=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"
      - name: Read version and refuse to modify an older release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ env.LI_VERSION }}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Raise 'version:' in pubspec.yaml so this update gets its own release."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Localview Installer ${{ env.VERSION }}
          make_latest: true
          overwrite_files: true
          files: dist/*
          body: |
            Pick your device, processor and Localview version (LAN, WAN or Combined); the installer downloads the matching file from the latest [Localview release](https://github.com/GMWester/Localview/releases/latest) and opens/installs it.

            | Run it on | File |
            |---|---|
            | Windows | `LocalviewInstaller-windows-x64.zip`, Windows on ARM: `LocalviewInstaller-windows-arm64.zip` (unzip, run *Localview Installer.exe*) |
            | macOS | `LocalviewInstaller-macos.dmg` |
            | Linux / SteamOS | `LocalviewInstaller-linux-<x64\|arm64>.AppImage` (or `.tar.gz`) |
            | Android, Android TV, Quest / Android XR | `LocalviewInstaller-android.apk` |
            | iPhone / iPad | `LocalviewInstaller-ios-unsigned.ipa` (sideload) |
